<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  font: 1.2em / 1.5 sans-serif;
}
ul {
  width: 450px;
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  background-color: #576b7f;
  border: 2px solid #293b42;

  color: white;
  padding: 0.5em;
  margin: 0.5em;
}

ul {
  display: flex;
  flex-wrap: wrap;
}

li {
  flex: auto;
  color: #a6c0c9;
}
    </style>
</head>
<body>
    <ul>
  <li>Turnip</li>

</ul>
